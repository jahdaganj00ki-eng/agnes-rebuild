    text_rpm: 20
    image_rpm:
      "1K": 20
      "2K": 10
      "3K": 1
      "4K": 1
    video_rpm: 1
    video_daily_seconds: 500
  enterprise:
    text_rpm: 40
    image_rpm:
      "1K": 40
      "2K": 20
      "3K": 1
      "4K": 1
    video_rpm: 2
    video_daily_seconds: 500
  token_plan_starter:
    text_5h: 1500
    text_weekly: 15000
    image_daily: 4000
    video_daily_seconds: 500
  token_plan_plus:
    text_5h: 7500
    text_weekly: 75000
