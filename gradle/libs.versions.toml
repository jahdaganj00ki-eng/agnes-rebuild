[versions]
agp = "8.7.0"
kotlin = "2.0.21"
composeBom = "2024.09.00"
kotlinxCoroutines = "1.8.1"
kotlinxSerialization = "1.6.3"
retrofit = "2.11.0"
okhttp = "4.12.0"
gson = "2.11.0"
coil = "2.7.0"
room = "2.6.1"
datastore = "1.1.7"
lifecycle = "2.8.4"
navigation = "2.8.4"
media3 = "1.5.1"
playBilling = "7.1.0"
firebaseBom = "33.4.0"
junit = "4.13.2"
junitJupiter = "5.11.0"
turbine = "1.2.0"
mockwebserver = "4.12.0"
espresso = "3.6.1"
koin = "3.5.6"
ktor = "3.0.0"
logback = "1.5.6"
slf4j = "2.0.13"

[libraries]
# Android Gradle Plugin
agp = { module = "com.android.tools.build:gradle", version.ref = "agp" }

# Kotlin
kotlinAndroid = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinCompose = { module = "org.jetbrains.kotlin:kotlin-compose", version.ref = "kotlin" }
kotlinSerialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Compose
composeBom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
composeUi = { module = "androidx.compose.ui:ui" }
composeMaterial3 = { module = "androidx.compose.material3:material3" }
composeRuntime = { module = "androidx.compose.runtime:runtime" }
composeCompiler = { module = "org.jetbrains.kotlin:kotlin-compose-compiler-plugin", version.ref = "kotlin" }
activityCompose = { module = "androidx.activity:activity-compose" }
lifecycleRuntimeCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose" }

# Navigation
navigationCompose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# Coroutines
coroutinesAndroid = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
coroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# Retrofit / OkHttp / Gson
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofitGson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttpLogging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttpSse = { module = "com.squareup.okhttp3:okhttp-sse", version.ref = "okhttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# Coil
coil = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
coilBase = { module = "io.coil-kt:coil-base", version.ref = "coil" }

# Room
roomRuntime = { module = "androidx.room:room-runtime", version.ref = "room" }
roomKtx = { module = "androidx.room:room-ktx", version.ref = "room" }
roomCompiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# DataStore
datastorePreferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
datastoreCore = { module = "androidx.datastore:datastore-core", version.ref = "datastore" }

# Lifecycle
lifecycleViewModelCompose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycleViewModelKtx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycleRuntimeKtx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }

# Media3
media3ExoPlayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3Ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3Common = { module = "androidx.media3:media3-common", version.ref = "media3" }

# Play Billing
playBilling = { module = "com.android.billingclient:billing-ktx", version.ref = "playBilling" }

# Firebase
firebaseBom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebaseAnalytics = { module = "com.google.firebase:firebase-analytics-ktx" }
firebaseMessaging = { module = "com.google.firebase:firebase-messaging-ktx" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
junitJupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }
espressoCore = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
espressoContrib = { module = "androidx.test.espresso:espresso-contrib", version.ref = "espresso" }
androidxJunit = { module = "androidx.test.ext:junit", version = "1.2.1" }
androidxRunner = { module = "androidx.test:runner", version = "1.6.1" }
androidxRules = { module = "androidx.test:rules", version = "1.6.1" }
truth = { module = "com.google.truth:truth", version = "1.1.5" }

# Koin (manual DI alternative - lightweight)
koinCore = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koinAndroid = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koinAndroidxCompose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }

# Ktor (for sidecar)
ktorServerCore = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktorServerNetty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktorSerialization = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktorContentNegotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktorCors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktorCallLogging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktorServerTestHost = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktorClientCore = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktorClientCio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktorClientSerialization = { module = "io.ktor:ktor-client-serialization", version.ref = "ktor" }
ktorClientAuth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktorClientLogging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }

# Logging
slf4jApi = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logbackClassic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlinKsp = { id = "com.google.devtools.ksp", version = "2.0.21-2.0.1" }